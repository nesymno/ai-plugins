name: agent-gates

on:
  push:
    paths: ['agents/**', 'hooks/**', 'harness/**', 'skills/**', '.claude-plugin/**', '.github/workflows/agent-gates.yml']
  pull_request:
    paths: ['agents/**', 'hooks/**', 'harness/**', 'skills/**', '.claude-plugin/**']
  schedule:
    - cron: '0 6 * * 1'   # weekly: catches gates that rotted without a commit

jobs:
  verify-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Restore exec bits
        run: chmod +x hooks/*.sh harness/*.sh
      - name: Validate plugin manifests
        run: |
          jq -e . .claude-plugin/plugin.json > /dev/null
          jq -e . .claude-plugin/marketplace.json > /dev/null
          jq -e . hooks/hooks.json > /dev/null
      - name: Verify enforcement gates
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}
        run: harness/verify-gates.sh
      - name: Skip census
        run: |
          n=$(grep -rn "t\.Skip\|testing\.Short()" --include='*_test.go' . \
              | grep -v 'ALLOW-SKIP' | grep -v 'harness/fixtures' | wc -l)
          echo "unjustified skips: $n"
          echo "unjustified skips: $n" >> "$GITHUB_STEP_SUMMARY"
